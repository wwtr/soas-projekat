spring.application.name=api-gateway
server.port=8765
spring.main.web-application-type=reactive

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.routes[0].id=currency-conversion
spring.cloud.gateway.routes[0].uri=lb://currency-conversion
spring.cloud.gateway.routes[0].predicates[0]=Path=/currency-conversion

spring.cloud.gateway.routes[1].id=trade-service
spring.cloud.gateway.routes[1].uri=lb://trade-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/trade-service

spring.cloud.gateway.routes[2].id=users-service
spring.cloud.gateway.routes[2].uri=lb://users-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[3].id=bank-account
spring.cloud.gateway.routes[3].uri=lb://bank-account
spring.cloud.gateway.routes[3].predicates[0]=Path=/bank-account/**

spring.cloud.gateway.routes[4].id=crypto-wallet
spring.cloud.gateway.routes[4].uri=lb://crypto-wallet
spring.cloud.gateway.routes[4].predicates[0]=Path=/crypto-wallet/**

spring.cloud.gateway.routes[5].id=currency-exchange
spring.cloud.gateway.routes[5].uri=lb://currency-exchange
spring.cloud.gateway.routes[5].predicates[0]=Path=/currency-exchange/**

spring.cloud.gateway.routes[6].id=crypto-exchange
spring.cloud.gateway.routes[6].uri=lb://crypto-exchange
spring.cloud.gateway.routes[6].predicates[0]=Path=/crypto-exchange/**
